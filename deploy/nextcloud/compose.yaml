name: poliedro-billing
services:
  api:
    image: ${BILLING_API_IMAGE:-poliedro-billing-api:latest}
    build: {context: ., dockerfile: Dockerfile.api}
    restart: unless-stopped
    network_mode: host
    mem_limit: 384m
    env_file: ./.secrets/api.env
    environment:
      ASPNETCORE_URLS: http://127.0.0.1:15068
      ASPNETCORE_ENVIRONMENT: Production
    volumes: ["./.secrets/api-settings.json:/app/appsettings.json:ro"]
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
  hangfire:
    image: ${BILLING_HANGFIRE_IMAGE:-poliedro-billing-hangfire:latest}
    build: {context: ., dockerfile: Dockerfile.hangfire}
    restart: unless-stopped
    network_mode: host
    mem_limit: 256m
    env_file: ./.secrets/hangfire.env
    environment:
      ASPNETCORE_URLS: http://127.0.0.1:15069
      ASPNETCORE_ENVIRONMENT: Production
    depends_on: {api: {condition: service_started}}
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
